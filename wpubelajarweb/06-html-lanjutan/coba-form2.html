<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh title Atribut, Checkbox & Radio</title>
</head>
<body>
    <h1>Contoh Atribut title, Checkbox & Radio</h1>
    <form> 
        <label for="nama">Nama:
            <input type="text" name="nama" id="nama"
            placeholder="Masukkan Nama" autocomplete="off" autofocus required >
        </label>
        <br>

        <h3>Hobby:</h3>
        <label for="hobby1">
            <input type="checkbox" name="hobby1" id="hobby1" value="Olahraga"
            checked>
            Olahraga
        </label>

        <br>
        <label for="hobby2">
            <input type="checkbox" name="hobby2" id="hobby2" value="Membaca">
            Membaca
        </label>
        <br>

        <h3>Jenis Kelamin:</h3>
        <label for="Pria">
            <input type="radio" name="Jenis Kelamin" id="laki-laki" value="Pria"
            value="Pria" Checked>
            Pria
        </label>
        <br>
        <label for="Wanita">
            <input type="radio" name="Jenis Kelamin" id="perempuan" 
            value="Wanita">
            Wanita
          </label>



        <br>
        <button type="submit">Kirim</button>
    </form>
</body>
</html>
