<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Element Form Di dalam table</title>
</head>
<body>
    <h1>Contoh Element-Element Form Pada HTML</h1>
    
    <form >

        <table cellpading="4">
            <tr>
                <td align="right"><label for="nama">Nama:</label>
        </td>
                <td>
                    <input type="text" name="nama" id="nama" placeholder="Masukkan Nama">
                </td>
            </tr>
            <tr>
                <td align="right"><label for="password">Password:</label></td>
                <td>
                     <input type="password" name="password" id="password" placeholder="Masukkan Password">

                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="email">Email:</label>
                </td>
                <td>
                     <input type="email" name="email" id="email" placeholder="Masukkan Email">
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="angka">Angka:</label>
                </td>
                <td>
        <input type="number" name="number" id="number" min="0" max="100" step="5">
      </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="tanggal">Tanggal:</label>
                </td>
                <td>
                    <input type="date" name="tanggal" id="tanggal">
                </td>
            </tr>
            <tr>
                <td align="right">
                      <label for="warna">Warna:</label>
                </td>
                <td>
                      <input type="color" name="warna" id="warna">
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Kirim!</button>
                </td>
            </tr>
        </table>    
    </form>


</body>
</html>
