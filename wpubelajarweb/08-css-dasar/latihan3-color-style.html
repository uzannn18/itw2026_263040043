<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Fauzan Alfarizi</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color:rgb(9, 168, 211);
            text-align: center;
            background-color: rgb(21, 21, 18);
        }
        h1{
            font-size: 48px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color:rgba(249, 247, 247, 0.797);
            text-shadow: 5px 5px 0 rgb(77, 77, 77);

        }
        .quote{
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
        }
        span{
            color: rgb(241, 3, 3);
            text-decoration: line-through;
        }
        .credit{
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(159, 157, 157);
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>fase runtuh</h1>
    <p class="quote">"Tak perlu khawatir, ku hanya <span>terluka.</span><br>tuk pura-pura tertawa.<br> namun bolehkah sekali saja ku menangis?<br> sebelum kembali membohongi diri"</p>
    <p class="credit">fauzan alfarizi</p>
</body>
</html>
