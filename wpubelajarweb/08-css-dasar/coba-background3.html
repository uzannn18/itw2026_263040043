<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Backgroud</title>
    <style>
        body{
            background-color: aqua;
            background-image: linear-gradient(pink,black);
            height: 100vh;
        }
        .kotak1{
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            background-image: linear-gradient(rgb(125, 4, 166),rgb(29, 25, 25));

        }
        .kotak2{
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            background-image: radial-gradient(rgb(165, 147, 171),rgb(29, 25, 25));

        }
        .kotak3{
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            background-image: conic-gradient(rgb(125, 4, 166),rgb(29, 25, 25),rgb(125, 122, 122));

        }
    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
